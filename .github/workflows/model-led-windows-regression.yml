name: Model-led Windows regression
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/model-led-windows-regression.yml, backend/engine.py, backend/model_protocol.py, tests/model_led.py]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        revision: [v0.4.4, candidate]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.revision == 'candidate' && github.sha || matrix.revision }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install application dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run Windows and model-led regression suites
        shell: pwsh
        run: ./scripts/run-tests.ps1 -Report windows-test-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-report-${{ matrix.revision }}
          path: windows-test-report.txt
