<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luminaria · Settings review</title><style>
:root{color-scheme:light;--bg:#fff;--nav:#f8f8f5;--panel:#fff;--text:#172019;--muted:#62685e;--line:#e1e4dc;--hover:#f0f1ec;--accent:#344b32;--soft:#edf2e9;--danger:#9b3434}*{box-sizing:border-box}body{margin:0;background:var(--nav);font:14px/1.55 'Segoe UI',system-ui,sans-serif;color:var(--text)}body.dark{color-scheme:dark;--bg:#121815;--nav:#0e1410;--panel:#19201a;--text:#f4ecdc;--muted:#adb5a5;--line:#323c31;--hover:#273024;--accent:#dfd5bd;--soft:#263221;--danger:#ecaba0}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}button:disabled{cursor:default;opacity:.5}.review-bar{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 28px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.review-bar span{display:flex;align-items:center;gap:8px}.review-bar i{width:6px;height:6px;border-radius:50%;background:#879c76}.review-bar button{background:none;border:0;color:var(--text);text-decoration:underline;text-underline-offset:4px}.shell{background:var(--bg);max-width:1580px;margin:auto;min-height:calc(100vh - 42px)}.top{height:106px;border-bottom:1px solid var(--line);padding:24px 32px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:26px;line-height:1.2;font-weight:550;letter-spacing:-.035em;margin:0 0 6px}.top p{font-size:12px;color:var(--muted);margin:0}.account-chip{display:flex;gap:10px;align-items:center;font-size:12px}.account-chip img{width:28px;height:28px}.account-chip small{display:block;color:var(--muted);font-size:10px}.layout{display:grid;grid-template-columns:244px minmax(0,1fr);height:calc(100vh - 148px);min-height:500px}aside{background:var(--nav);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.search{margin:20px 16px 8px}.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px}.navigation{overflow:auto;flex:1;padding:0 12px 20px}.nav-group h2{font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:600;color:var(--muted);margin:20px 12px 8px}.nav-group button{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:9px 12px;margin:2px 0;background:none;color:var(--text);border:1px solid transparent;border-radius:7px;font-size:12px}.nav-group button:hover{background:var(--hover)}.nav-group button[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:600}.nav-group button[aria-current=page]:after{content:'›';font-size:16px}.nav-foot{padding:16px 24px;border-top:1px solid var(--line);font-size:11px;line-height:1.7;color:var(--muted)}main{overflow:auto;padding:34px 44px 60px}.content{max-width:960px;margin:auto}.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:12px}.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:28px}.page-heading h2{font-size:27px;line-height:1.2;letter-spacing:-.03em;font-weight:550;margin:0 0 9px}.page-heading p{margin:0;color:var(--muted);font-size:13px;max-width:64ch}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;white-space:nowrap;text-decoration:none}.btn:hover{background:var(--hover)}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.danger{color:var(--danger)}.identity{display:flex;align-items:center;gap:18px;padding:26px;border:1px solid var(--line);border-radius:12px;margin-bottom:24px}.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:var(--bg);font-size:25px;flex-shrink:0}.identity h3{font-size:19px;font-weight:550;margin:0 0 4px}.identity p{font-size:12px;margin:0;color:var(--muted)}.identity .btn{margin-left:auto}.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;background:var(--soft);border-radius:5px;color:var(--accent);font-size:10px;font-weight:500}.pill:before{content:'';width:5px;height:5px;background:currentColor;border-radius:50%}.section-label{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.section-label h3{font-size:13px;font-weight:600;margin:0}.section-label a{font-size:12px;color:var(--accent);text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.stat{padding:18px 20px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat small{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:25px;font-weight:500;margin-top:6px;font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:11px;padding:22px;text-align:left;color:var(--text);background:var(--bg);display:block}.card h3{font-size:14px;font-weight:600;margin:0 0 7px}.card p{font-size:12px;color:var(--muted);margin:0;line-height:1.7}.card .card-link{display:block;font-size:12px;color:var(--accent);margin-top:18px}.card:hover{border-color:var(--muted)}.note{font-size:11px;color:var(--muted);line-height:1.75;margin:12px 0}.section{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:22px}.section-header{padding:18px 22px;border-bottom:1px solid var(--line)}.section-header h3{margin:0;font-size:13px;font-weight:600}.section-header p{margin:4px 0 0;color:var(--muted);font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:20px 22px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row h4{font-size:13px;font-weight:550;margin:0 0 5px}.row p{font-size:12px;color:var(--muted);margin:0;max-width:58ch;line-height:1.65}.row .provider{display:flex;align-items:center;gap:14px}.provider-icon{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:600}.notice{padding:16px 20px;border-radius:9px;background:var(--soft);color:var(--accent);font-size:12px;line-height:1.7;margin:0 0 22px}.field{display:grid;gap:9px;font-size:12px;padding:22px}.field input,.field select,.row select{padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);width:100%}.field input[type=range]{padding:0;accent-color:var(--accent)}.field .range-label{display:flex;justify-content:space-between;gap:20px}.range-label output{font-weight:600}.toggle{appearance:none;width:35px;height:21px;background:var(--line);border:0;border-radius:20px;position:relative;cursor:pointer;flex-shrink:0}.toggle:after{content:'';width:15px;height:15px;border-radius:50%;position:absolute;top:3px;left:3px;background:var(--bg);transition:transform .15s}.toggle:checked{background:var(--accent)}.toggle:checked:after{transform:translateX(14px)}details{border-top:1px solid var(--line);padding:20px 0;margin-top:28px}summary{cursor:pointer;font-size:12px;color:var(--muted)}details p{font-size:12px;color:var(--muted);max-width:66ch}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.danger-zone{margin-top:32px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:24px;border-top:1px solid var(--line)}.danger-zone p{font-size:12px;color:var(--muted);margin:0}.empty-chart{height:125px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:12px;margin-top:14px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:9px;font-size:12px;box-shadow:0 6px 22px #0002;max-width:90vw;z-index:5}#toast:empty{display:none}.option-grid{display:flex;gap:10px;padding:22px;flex-wrap:wrap}.option-grid button{flex:1;min-width:120px;text-align:left;padding:18px;border:1px solid var(--line);background:var(--bg);border-radius:9px;color:var(--text)}.option-grid button.active{outline:1px solid var(--accent);background:var(--soft)}.option-grid small{display:block;font-size:11px;margin-top:5px;color:var(--muted)}@media(max-width:1050px){main{padding:28px}.layout{grid-template-columns:214px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.cards{grid-template-columns:1fr}}@media(max-width:700px){.top{padding:20px;height:100px}.account-chip{display:none}.review-bar{padding:8px 20px}.layout{display:block;height:auto}.navigation{display:flex;overflow:auto;padding:4px 12px}.nav-group{display:flex;flex-shrink:0}.nav-group h2,.search,.nav-foot{display:none}.nav-group button{width:auto;white-space:nowrap}aside{border:0;border-bottom:1px solid var(--line)}main{padding:24px 20px}.identity{padding:18px;flex-wrap:wrap}.identity .btn{margin-left:0}.row{padding:18px;gap:12px;flex-wrap:wrap}.page-heading h2{font-size:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body:not(.dark):not(.legacy){--bg:#fff;--nav:#f7f7f7;--panel:#fff;--text:#111;--muted:#666;--line:#ddd;--hover:#eee;--accent:#111;--soft:#ededed}body.dark{--bg:#080808;--nav:#111;--panel:#171717;--text:#fafafa;--muted:#aaa;--line:#333;--hover:#222;--accent:#fff;--soft:#262626}.calendar-wrap{border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:20px;overflow:auto}.calendar-grid{display:grid;grid-template-rows:repeat(7,10px);grid-auto-flow:column;grid-auto-columns:10px;gap:4px;width:max-content;margin:14px 0}.calendar-cell{background:var(--hover);border:1px solid var(--line);border-radius:2px}.calendar-heading{display:flex;justify-content:space-between;gap:16px;font-size:12px}.calendar-heading a{color:var(--text)}</style></head><body><div class="review-bar"><span><i></i>Settings layout preview · example account state · changes stay in this preview</span><button id="theme">Switch to dark</button></div><div class="shell"><header class="top"><div><h1>Settings</h1><p>A clear place for your account, workspace and AI.</p></div><div class="account-chip"><img src="brand/luminaria.svg" alt=""><div>Luminaria<small>Settings concept</small></div></div></header><div class="layout"><aside><label class="search"><input id="search" type="search" placeholder="Find a setting…" aria-label="Find a setting"></label><nav class="navigation" aria-label="Settings sections"></nav><div class="nav-foot">One account. Separate controls.<br>No live settings changed here.</div><button class="btn" id="preview-logout" style="width:100%;margin-top:16px;background:#c62828;color:#fff;border-color:#c62828" type="button">Log out</button></aside><main tabindex="-1"><div class="content" id="content"></div></main></div></div><div id="toast" role="status"></div>
<script>
const groups=[['Your account',['Profile','Sign-in methods','Devices & security','Insights']],['Workspace',['Working folder','Memory & context','Tools & permissions','Integrations']],['Models & voice',['Model library','Orchestration','Voice','Hardware & tuning']],['Application',['Appearance','Updates']]];
const descriptions={'Profile':'Your identity and activity at a glance.','Sign-in methods':'Choose how you sign in to your one Luminaria account.','Devices & security':'Manage remembered devices and when Luminaria asks you to sign in.','Insights':'Understand your measured activity without mixing it with account controls.','Working folder':'Choose where the assistant reads and creates files.','Memory & context':'Control what stays in the conversation and what is remembered.','Tools & permissions':'Decide what the assistant can do before it acts.','Model library':'Download, select and measure models in one place.','Orchestration':'Choose which downloaded models can work together.','Voice':'Choose how Luminaria listens, speaks and handles interruptions.','Hardware & tuning':'Understand your computer and test changes before keeping them.','Appearance':'Make Luminaria comfortable without changing how it works.','Updates':'Check versions, review changes and install when you are ready.'};
let theme='light';let current='Profile',dark=false,compact=80,budget=4096;let toastTimer;
const activityCalendar=()=>`<section class="calendar-wrap" aria-label="Token activity calendar"><div class="calendar-heading"><strong>Token activity</strong><a href="#" data-page="Insights">Open Insights →</a></div><div class="calendar-grid">${Array.from({length:364},()=>'<span class="calendar-cell" title="Activity not loaded in preview"></span>').join('')}</div><p class="note">Past 52 weeks · Activity is not loaded in this preview. Empty squares do not represent zero usage.</p></section>`;
const notice=()=>'<p class="note">Layout preview: example account state; metrics and device records are not fetched from your app.</p>';
const btn=(label,target)=>`<button class="btn" data-page="${target}">${label}</button>`;
const card=(title,copy,target)=>`<button class="card" data-page="${target}"><h3>${title}</h3><p>${copy}</p><span class="card-link">Manage ${title.toLowerCase()} →</span></button>`;
const row=(title,copy,control)=>`<div class="row"><div><h4>${title}</h4><p>${copy}</p></div>${control}</div>`;
const toggle=(label,checked=false)=>`<input class="toggle" type="checkbox" aria-label="${label}" ${checked?'checked':''}>`;
function message(text){document.querySelector('#toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4500)}
function nav(){const q=document.querySelector('#search').value.toLowerCase();document.querySelector('.navigation').innerHTML=groups.map(([group,pages])=>`<section class="nav-group"><h2>${group}</h2>${pages.filter(page=>(page+' '+descriptions[page]).toLowerCase().includes(q)).map(page=>`<button data-page="${page}" ${page===current?'aria-current="page"':''}>${page}</button>`).join('')}</section>`).join('');document.querySelectorAll('.navigation [data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page))}
function show(page){current=page;nav();const group=groups.find(g=>g[1].includes(page))[0];let body='';
if(page==='Profile')body=`<section class="identity"><span class="avatar" aria-hidden="true">L</span><div><h3>Your Luminaria account</h3><p>One identity across your connected sign-in methods.</p><span class="pill">Example signed-in state</span></div>${btn('Manage sign-in','Sign-in methods')}</section><div class="section-label"><h3>Your activity</h3><a href="#" data-page="Insights">Open Insights →</a></div><div class="stats">${['Recorded tokens','Peak daily tokens','Longest task','Longest streak'].map(x=>`<div class="stat"><small>${x}</small><strong>—</strong></div>`).join('')}</div>${activityCalendar()}${notice()}<div class="section-label"><h3>Account controls</h3></div><div class="cards">${card('Sign-in methods','Connect Google, GitHub and Discord to this same account.','Sign-in methods')}${card('Devices & security','Review sessions, sign out devices and control startup sign-in.','Devices & security')}</div>`;
else if(page==='Sign-in methods')body=`<div class="notice">These are ways to enter the same account. Connecting a provider does not give the assistant access to its email, repositories or messages.</div><section class="section"><div class="section-header"><h3>Connected accounts</h3><p>Connect another method while signed in to link it to your account.</p></div>${[['G','Google',true],['GH','GitHub',false],['D','Discord',false]].map(([symbol,name,connected])=>`<div class="row"><div class="provider"><span class="provider-icon" aria-hidden="true">${symbol}</span><div><h4>${name}</h4><p>${connected?'Connected · example state':'Continue securely in your browser'}</p></div></div>${connected?'<span class="pill">Connected</span>':`<button class="btn" data-demo="Browser sign-in would open for ${name}. No login starts from this preview.">Connect ${name}</button>`}</div>`).join('')}</section><p class="note">You will keep the same workspace and account when using linked sign-in methods.</p><div class="danger-zone"><div><strong>Use another account</strong><p>Sign out on this PC, then choose a different account.</p></div><button class="btn danger" data-demo="The live app would sign out and return to its login screen. This preview keeps your real session untouched.">Sign out on this PC</button></div>`;
else if(page==='Devices & security')body=`<section class="section"><div class="section-header"><h3>Opening Luminaria</h3></div>${row('Require sign-in','Open your workspace only with a valid session. Remembered sessions avoid repeated prompts.',toggle('Require sign-in',true))}${row('Remembered sessions','Online sessions expire after 30 days without use and no later than 90 days after creation.','<span class="pill">Automatic</span>')}${row('Offline access','Available for up to seven days after a successful online check. Offline sign-out still clears this PC’s credentials.','')}</section><section class="section"><div class="section-header"><h3>Signed-in devices</h3><p>Device names and last-active times belong here, not on the Profile overview.</p></div>${row('This Windows PC','Example device · current session','<span class="pill">This PC</span>')}</section><div class="actions"><button class="btn" data-demo="The live app will ask before revoking other sessions.">Sign out other devices</button></div>`;
else if(page==='Insights')body=`<div class="option-grid"><button class="active" data-demo="Local measurements selected.">This PC<small>Recorded on this computer</small></button><button data-demo="Account totals require sign-in and optional sync.">All devices<small>Optional synchronized totals</small></button></div><div class="stats">${['Recorded tokens','Busiest day','Active task time','Current streak'].map(x=>`<div class="stat"><small>${x}</small><strong>—</strong></div>`).join('')}</div><div class="section-label"><h3>Token activity</h3><span class="note">Daily · Weekly · Cumulative</span></div><div class="empty-chart">Real measured activity appears here.<br>No synthetic counts are shown in this layout preview.</div><section class="section" style="margin-top:24px">${row('Sync daily totals','Upload aggregate activity counters. Raw conversations and files are not included.',toggle('Sync daily totals'))}</section>`;
else if(page==='Working folder')body=`<section class="section"><div class="section-header"><h3>Where the assistant works</h3><p>Changing this folder does not move existing files.</p></div><label class="field">Working folder<input value="Choose a folder on your PC" readonly></label><div class="row"><p>File tools stay within this folder. Computer and command tools have separate permissions.</p><button class="btn" data-demo="The live app opens Windows’ folder chooser here.">Browse this PC…</button></div></section><div class="cards">${card('Tools & permissions','Control actions and access independently of the working folder.','Tools & permissions')}${card('Memory & context','Manage saved facts and working conversation context.','Memory & context')}</div><details><summary>Advanced · Existing local profiles</summary><p>Older local profiles and migration choices live here. Keep their chats and files separate, or explicitly attach a profile to your account.</p><button class="btn" data-demo="This would open the legacy profile manager, with clear explanations before any change.">Manage local profiles</button></details>`;
else if(page==='Memory & context')body=`<section class="section"><div class="section-header"><h3>Conversation context</h3><p>How much of the conversation the model can use at once.</p></div><label class="field"><span class="range-label">Compact when context reaches <output id="compact-value">${compact}%</output></span><input type="range" id="compact" min="40" max="85" value="${compact}"><span class="note">Summarize older turns before the window fills. Original history stays saved on disk.</span></label><label class="field"><span class="range-label">Reserve room for the reply <output id="budget-value">${budget.toLocaleString()} tokens</output></span><input type="range" id="budget" min="256" max="8192" step="256" value="${budget}"><span class="note">More room allows longer replies, leaving less space for the conversation.</span></label></section><div class="cards">${card('Saved memory','Review important facts, decisions and pinned context.','Memory & context')}${card('Model context limits','Set individual context windows in each model’s details.','Model library')}</div><div class="actions"><button class="btn primary" data-demo="Preview only. Your actual context settings have not changed.">Save context settings</button></div>`;
else if(page==='Integrations')body=`<div class="notice">Connect services the assistant can use. These connections are separate from your Luminaria sign-in methods.</div><section class="section"><div class="section-header"><h3>Your services</h3><p>Choose a service to review what it can access and follow its setup steps.</p></div>${['GitHub','Google Drive','Notion','Slack','Linear'].map(name=>row(name,'Preview only · no connection status requested',`<button class="btn" data-demo="${name} setup would explain permissions, open authorization and verify the connection. No service is connected from this preview.">Set up ${name}</button>`)).join('')}</section>`;
else if(page==='Tools & permissions')body=`<section class="section"><div class="section-header"><h3>How the assistant acts</h3></div>${row('Review actions','Ask before sensitive changes. Useful when reviewing what the assistant is doing.','<span class="pill">Example selected mode</span>')}${row('Full access','Allow tool actions without Luminaria approvals. Changing this mode requires an app restart.',btn('Review access options','Tools & permissions'))}</section><div class="cards">${card('Built-in tools','See what each tool does and its approval behavior.','Tools & permissions')}${card('Connected integrations','Connect services through guided setup. Service access is separate from sign-in.','Integrations')}</div><p class="note">Service connections have their own page, separate from account sign-in.</p>`;
else if(page==='Model library')body=`<div class="notice">Model downloads, active-model selection, per-model context and benchmark results stay together in the model library.</div><section class="section"><div class="section-header"><h3>Library organization</h3></div>${row('Standard models','Original model releases, grouped separately.','<span class="pill">Library group</span>')}${row('Abliterated models','Clearly labeled variants, with the same download and benchmark controls.','<span class="pill">Library group</span>')}${row('Per-model settings','Context window, quantization, storage and measured speed.',btn('View model details','Model library'))}</section><div class="empty-chart">The existing model library would be embedded here.<br>This review focuses on settings organization, not fabricated model records.</div>`;
else if(page==='Orchestration')body=`<section class="section"><div class="section-header"><h3>Automatic delegation</h3><p>The coordinator may only choose from models you allow.</p></div>${row('Use automatic routing','Let a coordinator choose a suitable downloaded model.',toggle('Automatic routing'))}<label class="field">Which models can it use?<select><option>All downloaded models</option><option>Standard models only</option><option>Abliterated models only</option><option>Choose specific models</option></select></label>${row('Coordinator model','Choose an installed model to manage delegation.',btn('Choose model','Model library'))}</section><p class="note">Separate routing controls from downloading models. Explain fallback behavior beside the selection.</p>`;
else if(page==='Voice')body=`<section class="section"><div class="section-header"><h3>Speaking & listening</h3></div><label class="field">Voice<select><option>Choose from installed voices</option></select></label>${row('Microphone','Choose the input device used for conversation.','<select aria-label="Microphone"><option>System default</option></select>')}${row('Allow interruption','Stop the reply when you begin speaking.',toggle('Allow interruption',true))}${row('Voice setup','Install or check local speech models.','<button class="btn" data-demo="The live voice setup would show real installation and readiness checks.">Check setup</button>')}</section>`;
else if(page==='Hardware & tuning')body=`<section class="section"><div class="section-header"><h3>This computer</h3></div>${row('Hardware summary','Detected CPU, GPU and available memory appear here.','<span class="pill">Measured data</span>')}${row('Model benchmark','Measure real performance with the selected model.',btn('Open model benchmarks','Model library'))}${row('Advanced inference options','Group expert controls behind explanations and a way to restore defaults.','<button class="btn" data-demo="Advanced controls would open here, with measured results and reversible changes.">Review tuning</button>')}</section>`;
else if(page==='Appearance')body=`<section class="section"><div class="section-header"><h3>Theme</h3></div><div class="option-grid">${[['light','Light','Black text on white'],['dark','Dark','White text on black']].map(([value,label,copy])=>`<button data-theme-choice="${value}" class="${theme===value?'active':''}">${label}<small>${copy}</small></button>`).join('')}</div>${row('Background motion','Animate the entity and spatial background.',toggle('Background motion',true))}${row('Accent & interface colors','Keep customization together instead of scattering color controls across settings.','<button class="btn" data-demo="Your existing color customization would open as a dedicated, clearly grouped section.">Customize colors</button>')}</section><p class="note">This page changes the preview’s Light or Dark theme only. Your app theme remains untouched.</p>`;
else if(page==='Updates')body=`<section class="section"><div class="section-header"><h3>Desktop updates</h3></div>${row('Installed version','Show the actual installed desktop version here.','<span class="note">Not connected in preview</span>')}${row('Check for updates','Review release notes before installing.','<button class="btn" data-demo="No update request is made from this preview.">Check for updates</button>')}${row('Update history','See installation results and any required next steps.','<button class="btn" data-demo="The live history would list actual update results.">View history</button>')}</section>`;
